# Lancement local de l'API seule (développement), sur le port 3000.
# Le déploiement staging/production blue/green est dans deploy/.
services:
  api:
    build:
      context: .
      args:
        APP_VERSION: "local"
    image: cargoflow-api:local
    ports:
      - "3000:3000"
    # Le healthcheck (/readyz) est défini dans le Dockerfile.
