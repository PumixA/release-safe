# Reverse proxy blue/green de CargoFlow.
#
# La couleur servie est lue dans des fichiers générés par les scripts :
#   /etc/nginx/cargoflow/active.conf   -> set $active_color  blue|green;
#   /etc/nginx/cargoflow/preview.conf  -> set $preview_color blue|green;
# Une bascule = réécriture du fichier + `nginx -t` + `nginx -s reload`.
# Le reload est gracieux : les anciens workers terminent les requêtes en cours.

# DNS interne de Docker : les noms blue/green sont résolus à la requête,
# Nginx démarre donc même si une couleur est arrêtée.
resolver 127.0.0.11 valid=5s ipv6=off;

log_format cargoflow '$remote_addr [$time_local] "$request" $status '
                     '$body_bytes_sent ${request_time}s upstream=$upstream_addr '
                     'color=$cargoflow_color';

server {
    listen 8080;
    server_name _;

    include /etc/nginx/cargoflow/active.conf;
    set $cargoflow_color $active_color;

    access_log /var/log/nginx/access.log cargoflow;

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        proxy_pass http://$active_color:3000;
        include /etc/nginx/conf.d/proxy_params.inc;
    }
}

# Préversion : uniquement exposée sur 127.0.0.1 de l'hôte.
# Sert à valider la nouvelle couleur avant de lui envoyer le trafic public.
server {
    listen 8081;
    server_name _;

    include /etc/nginx/cargoflow/preview.conf;
    set $cargoflow_color $preview_color;

    access_log /var/log/nginx/access.log cargoflow;

    location / {
        proxy_pass http://$preview_color:3000;
        include /etc/nginx/conf.d/proxy_params.inc;
    }
}
